apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scraper-ingress
  annotations:
    # Pakottaa Ingressin päivittämään, mutta ei ratkaise Content-Type-ongelmaa yksinään.
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false" 
    
    # KRIITTINEN RIVI: Tämä annotaatio pakottaa Ingress-kontrollerin Nginx-instanssin
    # käsittelemään tiedostojen MIME-tyypit dynaamisesti (käyttäen Podin sisäisiä sääntöjä)
    # sen sijaan, että se käyttäisi omia, mahdollisesti virheellisiä, oletuksiaan.
    nginx.ingress.kubernetes.io/enable-mime-types: "true" 
    
    # Rewrite target poistaa /api-etuliitteen ennen kuin se välitetään api-service:lle.
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      # Reititys API-palveluun: /api(/|$)(.*) -> /$2
      - path: /api(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: api-service
            port:
              number: 5000
      # Oletusreitti Web-palveluun: /
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-service
            port:
              number: 80
