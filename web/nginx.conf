server {
listen 80;
server_name localhost;

# 1. Käsittele staattiset tiedostot eksplisiittisesti (CSS, JS, jne.).
# Tämä estää virheellisen index.html:n palautuksen CSS/JS-pyyntöihin.
location ~* \.(js|css|gif|jpg|jpeg|png|ico|woff2?|eot|ttf|svg|xml)$ {
    root   /usr/share/nginx/html;
    
    # KRIITTINEN: Jos tiedostoa EI löydy ($uri), palauta 404-virhe.
    try_files $uri $uri/ =404;
    
    # TÄMÄ ESTÄÄ VÄLIMUISTIONGELMAT TESTIÄ VARTEN
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}

# 2. Tämä lohko käsittelee juuripolun (/) ja SPA-logiikan.
location / {
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    
    # SPA-reititys: Jos polkua ei löydy, ohjaa index.html:ään.
    try_files $uri $uri/ /index.html;
}

}